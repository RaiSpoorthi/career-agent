# Certifications and achievements: a plain string, or {name, tracks, priority}.
#   tracks:   resumes this entry is most relevant to. No `tracks:` = shown on every resume.
#   priority: when a resume overflows one page, a lower number is dropped first.
# One-page fitting first drops certifications whose tracks don't include the resume's track,
# then achievements by priority. Education and at least one certification always stay.
certifications:
  - name: Qualys Certified Specialist, VMDR
    tracks: [security]
  - name: AWS Certified Cloud Practitioner
  - name: Kali Linux for Ethical Hackers
    tracks: [security]
achievements:
  - name: College Hackathon, Track Winner
    priority: 5
  - name: Inter-college Chess Championship, Runner-up
    priority: 1

# Job-search rules used by the fit check and the application-form answers.
preferences:
  languages: asked              # optional: list only the programming languages a job asks for
  default_language: Python      # ...and only this one when the job names none
  target_roles:
    - IAM Analyst / Identity Engineer
    - SOC Analyst
    - Cloud Security Engineer
    - Software Engineer (entry level)
  max_years_required: 2          # jobs asking for more get flagged as a stretch (up to +2 years), then skipped
  experience_strict: false       # true: skip every job asking for more than max_years_required
  home_country: India            # jobs elsewhere count as "abroad"
  # home_places: [berlin, munich, hamburg, germany]   # cities in your home country (built in for India)
  ok_locations: [bengaluru, bangalore, remote]   # home-country places you are happy to work in
  other_home_locations: review   # other cities in your home country: review (flag them) or skip (leave out)
  salary_min_lpa: 6              # India only: minimum pay in lakhs per annum. Remove if not in India.
  expected_salary: 6 LPA or above (open to discussion)   # your answer for jobs in your home country
  salary_min:                    # minimum annual pay by currency, for jobs that state it
    USD: 75000
    GBP: 40000
    EUR: 55000
  needs_visa_sponsorship_abroad: true
  notice_period_days: 30
  # CONFIRM this line is accurate before using the form answers.
  work_authorization: Authorized to work in India; requires visa sponsorship for roles outside India.
  graduation_year: 2026
