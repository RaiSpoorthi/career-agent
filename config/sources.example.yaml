recruitee: []
# Example:  - {site: examplecompany, company: Example Co}

smartrecruiters: []
# Example:  - {id: ExampleCompany, company: Example Co}

# Remote-only listings from remotive.com. Most are for other countries, so your rules will
# mark many REVIEW or SKIP. Their terms ask for at most a few requests a day: run the agent once or twice daily.
remotive: false

careers_pages: []
# Example:
# careers_pages:
#   - {company: Example Co, url: https://example.com/careers, keywords: [engineer, security, identity]}
#
# Good next additions if you want more: find a company's own careers page and check
# whether its job URLs contain "greenhouse.io" or "lever.co" -- if so it belongs above
# instead, with the board/site name taken from that URL.

# Email alerts: put .eml files (use Gmail's "Download message") in the inbox/ folder,
