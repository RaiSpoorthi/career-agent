# Where the agent looks for jobs. Everything here is optional; leave a list empty to skip it.
# You can edit this file here or on the dashboard's Settings page.
#
# All of these are free, public job-board feeds. No login, no API key.
#   greenhouse:      https://job-boards.greenhouse.io/<board>
#   lever:           https://jobs.lever.co/<site>
#   ashby:           https://jobs.ashbyhq.com/<board>
#   recruitee:       https://<site>.recruitee.com
#   smartrecruiters: https://jobs.smartrecruiters.com/<id>
#   remotive:        remote jobs from remotive.com (true/false)
#   careers_pages:   any public careers page; robots.txt is respected
# Find the name in the company's careers-page address. A wrong name only produces a
# "note:" line for that company; the others still run.

# A listing is kept only if its title contains one of these phrases (security, IAM, SOC, support, software, data)...
title_keywords: [security, cyber, identity, iam, access management, soc, threat, vulnerability, incident, cloud,
                 devops, sre, site reliability, infrastructure, network, platform engineer, software engineer,
                 software developer, development engineer, developer, sde, backend, frontend, full stack,
                 support engineer, technical support, support associate, customer success engineer, solutions engineer,
                 implementation, integration, technical services, operations engineer, escalation engineer,
                 data analyst, business intelligence, it analyst, it support, systems engineer, graduate, trainee,
                 associate engineer]
# ...and none of these whole words (above entry level, or outside your field).
exclude_title_keywords: [senior, sr, staff, principal, lead, manager, director, head, vp, architect, distinguished,
                         sales, seller, account, accountant, accounting, billing, payroll, benefits, tax, legal,
                         counsel, real estate, marketing, recruiter, recruiting, talent, people, finance, designer, ux,
                         content, intern, internship, "ii", "iii", "iv"]
# ...and its location mentions one of these (or gives no location). Remove this line to keep every location.
locations: [india, bengaluru, bangalore, remote, anywhere, worldwide, apac]

